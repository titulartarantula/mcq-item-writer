name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
        jsonschema: ["with", "without"]
    name: py${{ matrix.python }} (${{ matrix.jsonschema }} jsonschema)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional dependency
        if: matrix.jsonschema == 'with'
        run: pip install jsonschema
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Example bank lints clean
        run: python skills/mcq-item-writer/scripts/lint_items.py skills/mcq-item-writer/assets/example-bank.json --strict --quiet
